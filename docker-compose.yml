services:

  app:
    build:
      context: .
      target: app
    container_name: aetheria_app
    restart: unless-stopped
    volumes:
      - ./database:/var/www/html/database      # SQLite persisté
      - ./storage:/var/www/html/storage        # uploads / logs
      - app_public:/var/www/html/public        # assets partagés avec nginx
    environment:
      APP_NAME: Aetheria
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8888
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    networks:
      - aetheria_net

  nginx:
    image: nginx:1.27-alpine
    container_name: aetheria_nginx
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - app_public:/var/www/html/public:ro     # même volume que app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - aetheria_net

volumes:
  app_public:

networks:
  aetheria_net:
    driver: bridge
